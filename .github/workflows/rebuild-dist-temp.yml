name: Temporary Dist Rebuild

on:
  push:
    branches: [ remove-vpn-link-handler ]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: remove-vpn-link-handler

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Commit generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/Melonbooks - Enhancements.user.js"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild userscript without VPN Link Handler"
          git push origin HEAD:remove-vpn-link-handler
