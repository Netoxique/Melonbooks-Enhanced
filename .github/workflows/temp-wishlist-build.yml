name: Temporary Wishlist Fix Build

on:
  push:
    branches:
      - automation/wishlist-placeholder-fix

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Verify generated userscript
        run: npm run check

      - name: Upload generated userscript
        uses: actions/upload-artifact@v4
        with:
          name: melonbooks-enhancements-v1.0.1
          path: dist/Melonbooks - Enhancements.user.js

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json "dist/Melonbooks - Enhancements.user.js"
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "Build Melonbooks Enhanced v1.0.1 [skip ci]"
          git push
