name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build userscript
        run: npm run build

      - name: Commit generated userscript
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/Melonbooks - Enhancements.user.js"
          if ! git diff --cached --quiet; then
            git commit -m "Build Melonbooks Enhanced userscript"
            git push
          fi

      - name: Verify build artifact is clean and in-sync
        run: npm run check
